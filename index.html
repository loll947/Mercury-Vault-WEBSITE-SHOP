<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mercury Vault</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#07070a;
    color:white;
    font-family:Georgia,"Times New Roman",serif;
    line-height:1.6;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =========================
   NAVBAR
========================= */

.navbar{
    position:sticky;
    top:0;
    z-index:10;

    background:rgba(7,7,10,.95);

    border-bottom:1px solid #292932;

    backdrop-filter:blur(10px);
}

.nav{
    width:92%;
    max-width:1150px;

    min-height:70px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#aaa;

    font-family:Arial,sans-serif;
    font-size:14px;
}

nav a:hover{
    color:white;
}

.discord{
    background:#8952ed;

    padding:11px 18px;

    border-radius:8px;

    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:14px;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:600px;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:80px 20px;

    background:
        radial-gradient(
            circle,
            rgba(137,82,237,.18),
            transparent 60%
        );
}

.hero-content{
    max-width:800px;
}

.eyebrow{
    color:#9b6cff;

    letter-spacing:4px;

    font:bold 12px Arial,sans-serif;
}

.hero h1{
    margin-top:18px;

    font-size:clamp(50px,9vw,90px);

    line-height:1;
}

.hero h1 span{
    color:#9b6cff;
}

.hero p{
    color:#999;

    font:18px Arial,sans-serif;

    margin:25px auto;

    max-width:600px;
}

.buttons{
    display:flex;

    justify-content:center;

    gap:14px;
}

.button{
    display:inline-flex;

    justify-content:center;
    align-items:center;

    min-height:48px;

    padding:0 25px;

    border-radius:8px;

    font:bold 14px Arial,sans-serif;

    transition:.2s;
}

.button:hover,
.buy:hover{
    transform:translateY(-2px);
}

.primary{
    background:#8952ed;
}

.secondary{
    border:1px solid #444;
}


/* =========================
   SECTIONS
========================= */

.section{
    width:92%;

    max-width:1150px;

    margin:auto;

    padding:90px 0;
}

.title{
    text-align:center;

    margin-bottom:50px;
}

.title span{
    color:#9b6cff;

    letter-spacing:4px;

    font:bold 12px Arial,sans-serif;
}

.title h2{
    font-size:50px;

    margin-top:10px;
}

.title p{
    color:#888;

    font-family:Arial,sans-serif;

    margin-top:8px;
}


/* =========================
   CARDS
========================= */

.grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:20px;
}

.card{
    background:#0e0e13;

    border:1px solid #292932;

    border-radius:14px;

    padding:28px;

    transition:.2s;
}

.card:hover{
    border-color:#8952ed;
}


/* =========================
   SERVICES
========================= */

.service-icon{
    width:50px;
    height:50px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#181
